# Local development services for the Cloudflare Workers stack.
# Provides PostgreSQL and MinIO (S3/R2-compatible object storage).
#
# Usage:
#   make dev-services       # Start services
#   make stop-dev-services  # Stop services

services:
  postgres:
    image: postgres:16.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flexile
      POSTGRES_PASSWORD: flexile
      POSTGRES_DB: flexile_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexile"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/flexile-private;
      mc mb --ignore-existing local/flexile-public;
      mc anonymous set download local/flexile-public;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
